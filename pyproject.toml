[project]
name = "dpg"
version = "0.1.6"
description = "A Python library for extracting Decision Predicate Graphs and global explanations from ensemble models."
authors = [
    { name = "Sylvio Barbon Junior", email = "sylvio.barbonjunior@units.it" },
    { name = "Leonardo Arrighi", email = "leonardo.arrighi@phd.units.it" }
]
license = "MIT"
readme = "README.md"
keywords = ["decision graph", "ensemble learning", "explainable ai", "explainability", "global explanations"]
scripts = { "dpg" = "scripts.run_dpg_standard:main" }
classifiers = [
    "Programming Language :: Python :: 3"
]
requires-python = ">=3.10"
dependencies = [
    "contourpy>=1.2",
    "cycler>=0.12",
    "fonttools>=4.53",
    "graphviz>=0.20",
    "joblib>=1.4",
    "kiwisolver>=1.4",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=2.0.0",
    "packaging>=24.1",
    "pandas>=2.2",
    "pillow>=10.4",
    "pyparsing>=3.1",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "six>=1.16",
    "threadpoolctl>=3.5",
    "tqdm>=4.67",
    "tzdata>=2024.1",
    "pyyaml (>=6.0.2,<7.0.0)",
    "igraph>=1.0.0",
]

[project.urls]
homepage = "https://github.com/Meta-Group/DPG"
repository = "https://github.com/Meta-Group/DPG"

[dependency-groups]
dev = [
    # NOTE: do not add matplotlib-stubs here. matplotlib ships its own complete
    # inline types (py.typed); a stub-only package shadows them and regresses
    # Figure.patch, Colorbar.outline, Axes.set_yticks, to_rgba, ListedColormap.
    "mypy>=1.9",
    "pandas-stubs>=0.0.0",
    "pyrefly>=1.0.0",
    "pytest>=7.0",
    "ruff>=0.15.13",
    "ty>=0.0.37",
    "types-PyYAML>=6.0.0",
    "types-seaborn>=0.0.0",
]
docs = [
     "myst-nb>=1.1",
     "myst-parser>=3.0",
     "pydata-sphinx-theme>=0.15",
     "sphinx>=7.3",
     "sphinx-autoapi>=3.1",
     "sphinx-copybutton>=0.5",
     "sphinx-design>=0.6"
]

# -- optional docs dependencies (pip install ".[docs]") --
[project.optional-dependencies]
docs = [
    "myst-nb>=1.1",
    "myst-parser>=3.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx>=7.3",
    "sphinx-autoapi>=3.1",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
]

[tool.poetry]
packages = [
    { include = "dpg" },
    { include = "metrics" },
    # { include = "counterfactual" }
]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
pretty = true
show_error_codes = true
# Ignore third-party libraries that don't ship stubs

[[tool.mypy.overrides]]
module = [
    "graphviz.*",
    "networkx.*",
    "sklearn.*",
    "joblib.*",
    "tqdm.*",
    "scipy.*",
    "omegaconf.*",
    "PIL.*",
    "igraph.*",
]
ignore_missing_imports = true

# TODO: annotate dpg/visualizer.py's plot functions and drop this override.
# Every other check stays enabled for this module; only the missing-annotation
# rule is relaxed.
[[tool.mypy.overrides]]
module = "dpg.visualizer"
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
