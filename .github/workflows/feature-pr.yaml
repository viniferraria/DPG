name: Feature CI

on:
  push:
    branches:
      - "feature/**"
      - "feature*"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff
        run: uv run ruff check $(git ls-files '*.py')

      - name: Run pytest
        run: uv run pytest

      - name: Open pull request to develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list --base develop --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')" ]; then
            echo "PR from $GITHUB_REF_NAME to develop already exists, skipping."
          else
            gh pr create \
              --base develop \
              --head "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --body "Automated PR: ruff and pytest passed on \`$GITHUB_REF_NAME\`." \
              || echo "::warning::Could not open PR (e.g. no diff against develop)."
          fi
